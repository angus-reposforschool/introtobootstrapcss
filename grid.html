<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>grid</title>
</head>
<body>
    <div class="container text-center bg-primary">
        <h1 class="text-white">tic tac toe</h1>
        <div class="row row-cols-3 text-white">
            <div class="col">slot 1 <img src="circle.png" width="150"></div>
            <div class="col">slot 2 <img src="cross.png" width="150"></div>
            <div class="col">slot 3 <img src="cross.png" width="150"></div>
            <div class="col">slot 4 <img src="circle.png" width="150"></div>
            <div class="col">slot 5 <img src="circle.png" width="150"></div>
            <div class="col">slot 6 <img src="cross.png" width="150"></div>
            <div class="col">slot 7 <img src="cross.png" width="150"></div>
            <div class="col">slot 8 <img src="cross.png" width="150"></div>
            <div class="col">slot 9 <img src="circle.png" width="150"></div>
        </div> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
